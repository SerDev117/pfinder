name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pfinder
            archive: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pfinder
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pfinder
            archive: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pfinder.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf ${{ matrix.artifact }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} `
            -DestinationPath ${{ matrix.artifact }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.target }}
          path: ${{ matrix.artifact }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
